<style>
:root{--ink:#10304f;--ink2:#3f586f;--line:rgba(16,48,79,.13);--top:#55affd;--bottom:#e2eff3;
  --glass:rgba(255,255,255,.84);--btn:#10263d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bottom)}
body{margin:0;min-height:100vh;color:var(--ink);
  background:linear-gradient(180deg,var(--top) 0,#9cd3fb 45%,var(--bottom) 100%);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
a{color:#0b5cad}
img{max-width:100%}
.col{position:relative;max-width:480px;min-height:100vh;margin:0 auto;overflow:hidden;
  background:var(--bottom) url(../assets/hero.jpg) center top/100% auto no-repeat;
  box-shadow:0 0 48px rgba(16,48,79,.2)}
/* 插畫到底之後接平色：最後一段淡出，看不到接縫 */
.col::before{content:"";position:absolute;left:0;right:0;top:calc(min(100vw,480px) * 1.7768 - 100px);height:101px;
  background:linear-gradient(180deg,rgba(0,0,0,0),var(--bottom))}
.art{position:relative;padding-top:86%}
.art.short{padding-top:72%}
/* 開頭的手機（AI 魚圖畫面）＋浮在旁邊的釣友照片卡（2026-11-27，參考 Fishbrain 首頁）：插畫左半是海、右邊是釣客，手機放左邊稍微斜 */
.art.phone{padding-top:128%}
.hphone{position:absolute;left:7%;top:27%;width:36%;aspect-ratio:480/1039;border-radius:26px;border:5px solid #0f1720;
  overflow:hidden;background:#0f1720;transform:rotate(-5deg);box-shadow:0 18px 40px rgba(16,38,61,.38)}
.hphone img{display:block;width:100%;height:100%;object-fit:cover}
.hcard{position:absolute;z-index:2;width:25%;padding:5px 5px 7px;border-radius:12px;background:#fff;
  box-shadow:0 10px 26px rgba(16,38,61,.3)}
.hcard.a{left:38%;top:51%;transform:rotate(-4deg)}
.hcard.b{left:64%;top:57%;transform:rotate(5deg)}
.hcard img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 58%;border-radius:8px}
.hcard span{display:block;margin-top:5px;font-size:11px;line-height:1.35;color:var(--ink2);text-align:center}
.hcard b{display:block;font-size:12.5px;color:var(--ink)}
.hcard .ig{display:block;margin:2px -3px 0;font-size:8.5px;line-height:1.3;letter-spacing:-.02em;color:var(--ink2);text-align:center;
  white-space:nowrap}
.tag{position:absolute;left:6%;top:6%;width:52%;height:auto;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.85))}
.card{position:relative;margin:0 14px;padding:20px 18px 18px;border-radius:24px;background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(16,48,79,.16)}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.logo{flex:0 0 auto;width:60px;height:60px;border-radius:15px;box-shadow:0 2px 8px rgba(16,48,79,.2)}
.brand h1,.brand b{margin:0;font-size:23px;line-height:1.25;font-weight:800;letter-spacing:.02em}
.lead{margin:14px 0 12px;font-size:16.5px;font-weight:600;color:var(--ink)}
.feat{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:9px}
.feat li{display:flex;align-items:center;gap:11px;font-size:15.5px;color:var(--ink2)}
.feat svg{flex:0 0 auto;width:32px;height:32px;padding:6px;border-radius:10px;background:#e3f1fc;
  stroke:#1f6fb3;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stores{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.store{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;min-height:54px;padding:6px 8px;
  border-radius:11px;border:1px solid #a6a6a6;background:#000;color:#fff;text-decoration:none;line-height:1.1;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang TC","Microsoft JhengHei",sans-serif}
.store .si{flex:0 0 auto;width:24px;height:24px}
.store span{display:flex;flex-direction:column;white-space:nowrap;min-width:0}
.store small{font-size:9.5px;font-weight:500;letter-spacing:.02em}
.store b{font-size:clamp(15px,4.6vw,19px);font-weight:600;letter-spacing:-.01em}
.store.off{opacity:.45}
.foot{position:relative;padding:22px 16px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13.5px;
  color:var(--ink2)}
.foot nav{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin-bottom:6px}
.foot a{color:var(--ink);font-weight:600;text-decoration:none}
.foot a:hover{text-decoration:underline}
.kicker{margin:16px 0 2px;font-size:14px;font-weight:600;color:var(--ink2)}
.place{margin:0;font-size:24px;line-height:1.3;font-weight:800;word-break:break-word}
.coord{margin:4px 0 16px;font-size:14.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.acts{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;
  border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:16.5px;font-weight:700;text-decoration:none}
.btn.primary{border-color:transparent;background:linear-gradient(180deg,#f7c950,#e39b1b);color:#3b2200;
  box-shadow:0 4px 14px rgba(227,155,27,.35)}
.btn[hidden]{display:none}
.hint{margin:12px 2px 0;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.hint:empty{display:none}
.dl{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.dl p{margin:0 0 10px;font-size:14.5px;font-weight:600;color:var(--ink2)}
.doc{max-width:760px;margin:0 auto;padding:14px 14px 0}
.doc .brand{padding:6px 4px 14px}
.doc .brand .logo{width:42px;height:42px;border-radius:11px}
.doc .brand b{font-size:18px}
.paper{background:#fff;border-radius:22px;padding:26px 22px 30px;box-shadow:0 10px 30px rgba(16,48,79,.12)}
.paper h1{margin:0 0 2px;font-size:27px;line-height:1.3}
.paper .date{margin:0 0 18px;font-size:14px;color:var(--ink2)}
.paper h2{margin:28px 0 8px;padding-top:20px;border-top:1px solid var(--line);font-size:19px;line-height:1.4}
.paper h3{margin:18px 0 6px;font-size:16.5px}
.paper p{margin:8px 0}
.paper ul{margin:8px 0;padding-left:1.35em}
.paper li{margin:5px 0}
.paper .box{margin:14px 0;padding:13px 15px;border-radius:14px;background:#eef6fd;font-size:15.5px}
.todo{padding:0 4px;border-radius:5px;background:#fff1c9;color:#6b4a00}
@media (max-width:350px){.stores{grid-template-columns:1fr}.brand h1,.brand b{font-size:21px}}
/* 首頁三個功能（2026-11-27 使用者：「官網真的很空…分成左中右三格，一目了然所有功能」）：App 實錄的手機畫面 */
.feats{position:relative;margin:16px 14px 0;padding:16px 12px 14px;border-radius:24px;background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(16,48,79,.16)}
.feats h2{margin:0 4px 12px;font-size:18px;line-height:1.35;font-weight:800}
.fv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.fv figure{margin:0;display:flex;flex-direction:column;gap:7px}
.fv button{display:block;width:100%;padding:0;border:0;border-radius:14px;overflow:hidden;background:#0e141b;cursor:zoom-in;
  box-shadow:0 4px 14px rgba(16,48,79,.22);aspect-ratio:432/936}
.fv video{display:block;width:100%;height:100%;object-fit:cover}
.fv figcaption{text-align:center}
.fv figcaption b{display:block;font-size:15px;line-height:1.3;color:var(--ink)}
.fv figcaption span{display:block;margin-top:2px;font-size:12.5px;line-height:1.4;color:var(--ink2);white-space:nowrap}
.fz{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:66px 16px 16px;
  background:rgba(8,14,22,.86)}
.fz[hidden]{display:none}
.fz video{max-width:100%;max-height:calc(100vh - 82px);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.fz button{position:absolute;top:14px;right:14px;width:42px;height:42px;border:0;border-radius:21px;background:rgba(255,255,255,.16);
  color:#fff;font-size:22px;line-height:42px;cursor:pointer}
</style>
</head>
<body>
<div class="col">
<div class="art short"></div>
<main class="card">
<a class="brand" href="../"><img class="logo" src="../assets/logo-192.png" alt="" width="60" height="60"><b>台灣釣點地圖</b></a>
<p class="kicker">朋友分享了一個地點</p>
<h1 class="place" id="at-name">分享的地點</h1>

<div class="acts"><a class="btn primary" id="at-open" hidden>在 App 打開</a><a class="btn" id="at-gmap" target="_blank" rel="noopener">用 Google 地圖看位置</a></div>

<script>
(function () {
  var C = {"app": "台灣釣點地圖", "pkg": "com.timsucompany.taiwanfishingmap", "play": "https://play.google.com/store/apps/details?id=com.timsucompany.taiwanfishingmap", "scheme": "taiwanfishingmap"};
  var q = new URLSearchParams(location.search);
  var ll = (q.get("ll") || "").split(",");
  var lat = parseFloat(ll[0]), lon = parseFloat(ll[1]);
  var ok = ll.length === 2 && isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
  var nm = (q.get("n") || "").replace(/\s+/g, " ").trim().slice(0, 40);
  var $ = function (id) { return document.getElementById(id); };
  if (!ok) {
    $("at-name").textContent = "連結不完整";
    $("at-ll").textContent = "找不到位置，可能是複製的時候少了一段。";
    $("at-gmap").hidden = true;
    return;
  }
  $("at-name").textContent = nm || "分享的地點";
  document.title = (nm || "分享的地點") + "｜" + C.app;
  $("at-ll").textContent = lat.toFixed(5) + ", " + lon.toFixed(5);
  $("at-gmap").href = "https://www.google.com/maps/search/?api=1&query=" + lat.toFixed(6) + "," + lon.toFixed(6);
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var open = $("at-open");
  if (android && C.pkg) {
    /* 路徑要整段帶上（/taiwan-fishing-map/at/），App 只認這個路徑；2026-10-05 以前少了子路徑，
       在臉書、LINE 裡按「在 App 打開」對不到 App、沒反應 */
    open.href = "intent://" + location.host + location.pathname + location.search + "#Intent;scheme=https;package=" +
      C.pkg + ";S.browser_fallback_url=" +
      encodeURIComponent(C.play || location.href.replace(/\/at\/.*$/, "/")) + ";end";
    open.hidden = false;
  } else if (ios && C.scheme) {
    open.href = C.scheme + "://at/" + location.search;
    open.hidden = false;
  }
  if (!open.hidden) {
    $("at-hint").textContent = "已經裝了 App：在 Facebook、LINE 裡請按上面的「在 App 打開」。";
  } else if (ios) {
    $("at-hint").textContent = "已經裝了 App 卻停在這一頁：在 LINE、Facebook 裡請先點右上角「用 Safari 開啟」，再按一次連結。";
  }
})();
</script>
