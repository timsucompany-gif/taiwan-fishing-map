<style>
:root{--ink:#10304f;--ink2:#3f586f;--line:rgba(16,48,79,.13);--top:#55affd;--bottom:#e2eff3;
  --glass:rgba(255,255,255,.84);--btn:#10263d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bottom)}
body{margin:0;min-height:100vh;color:var(--ink);
  background:linear-gradient(180deg,var(--top) 0,#9cd3fb 45%,var(--bottom) 100%);

a{color:#0b5cad}
img{max-width:100%}

/* 插畫到底之後接平色：最後一段淡出，看不到接縫 */
.col::before{content:"";position:absolute;left:0;right:0;top:calc(min(100vw,480px) * 1.7768 - 100px);height:101px;

.card{position:relative;margin:0 14px;padding:20px 18px 18px;border-radius:24px;background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);

.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.logo{flex:0 0 auto;width:60px;height:60px;border-radius:15px;box-shadow:0 2px 8px rgba(16,48,79,.2)}
.brand h1,.brand b{margin:0;font-size:23px;line-height:1.25;font-weight:800;letter-spacing:.02em}
.lead{margin:14px 0 12px;font-size:16.5px;font-weight:600;color:var(--ink)}
.feat{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:9px}
.feat li{display:flex;align-items:center;gap:11px;font-size:15.5px;color:var(--ink2)}
.feat svg{flex:0 0 auto;width:32px;height:32px;padding:6px;border-radius:10px;background:#e3f1fc;
  stroke:#1f6fb3;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.store{display:flex;flex-direction:column;justify-content:center;min-height:54px;padding:7px 14px;
  border-radius:14px;background:var(--btn);color:#fff;text-decoration:none;line-height:1.25}
.store small{font-size:12px;opacity:.82}
.store b{font-size:17px;font-weight:700}
.store.off{background:rgba(16,38,61,.07);color:var(--ink2)}
.foot{position:relative;padding:22px 16px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13.5px;
  color:var(--ink2)}
.foot nav{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin-bottom:6px}
.foot a{color:var(--ink);font-weight:600;text-decoration:none}
.foot a:hover{text-decoration:underline}
.kicker{margin:16px 0 2px;font-size:14px;font-weight:600;color:var(--ink2)}
.place{margin:0;font-size:24px;line-height:1.3;font-weight:800;word-break:break-word}
.coord{margin:4px 0 16px;font-size:14.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.acts{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;
  border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:16.5px;font-weight:700;text-decoration:none}
.btn.primary{border-color:transparent;background:linear-gradient(180deg,#f7c950,#e39b1b);color:#3b2200;
  box-shadow:0 4px 14px rgba(227,155,27,.35)}
.btn[hidden]{display:none}
.hint{margin:12px 2px 0;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.hint:empty{display:none}
.dl{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.dl p{margin:0 0 10px;font-size:14.5px;font-weight:600;color:var(--ink2)}
.doc{max-width:760px;margin:0 auto;padding:14px 14px 0}
.doc .brand{padding:6px 4px 14px}
.doc .brand .logo{width:42px;height:42px;border-radius:11px}

.paper{background:#fff;border-radius:22px;padding:26px 22px 30px;box-shadow:0 10px 30px rgba(16,48,79,.12)}
.paper h1{margin:0 0 2px;font-size:27px;line-height:1.3}

.paper h2{margin:28px 0 8px;padding-top:20px;border-top:1px solid var(--line);font-size:19px;line-height:1.4}
.paper h3{margin:18px 0 6px;font-size:16.5px}
.paper p{margin:8px 0}
.paper ul{margin:8px 0;padding-left:1.35em}

.paper .box{margin:14px 0;padding:13px 15px;border-radius:14px;background:#eef6fd;font-size:15.5px}

<script>
(function () {
  var C = {"pkg": "com.timsucompany.taiwanfishingmap", "play": "https://play.google.com/store/apps/details?id=com.timsucompany.taiwanfishingmap", "scheme": "taiwanfishingmap"}, $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var rc = (q.get("rc") || "").toUpperCase().replace(/[^0-9A-Z]/g, "").slice(0, 8);
  if (rc.length !== 8) {
    $("rc-code").textContent = "連結不完整";
    $("rc-copy").hidden = true;
    $("rc-hint").textContent = "找不到兌換碼，可能是複製的時候少了一段，請朋友再傳一次。";
    return;
  }
  rc = rc.slice(0, 4) + "-" + rc.slice(4);
  $("rc-code").textContent = rc;
  function done(ok) {
    $("rc-copy").textContent = ok ? "已複製 ✓" : "複製兌換碼";
    if (ok) { return; }
    var r = document.createRange(), s = getSelection();       // 不能自動複製：先選起來，讓他長按「拷貝」
    r.selectNodeContents($("rc-code"));
    s.removeAllRanges();
    s.addRange(r);
    $("rc-hint").textContent = "這個瀏覽器不能自動複製：兌換碼已經選起來了，長按選「拷貝」。";
  }
  function fallback() {
    var a = document.createElement("textarea"), ok = false;
    a.value = rc;
    a.setAttribute("readonly", "");
    a.style.position = "fixed";
    a.style.top = "-200px";
    document.body.appendChild(a);
    a.select();
    a.setSelectionRange(0, rc.length);
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(a);
    done(ok);
  }
  $("rc-copy").addEventListener("click", function () {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(rc).then(function () { done(true); }, fallback);
    } else {
      fallback();
    }
  });
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var open = $("rc-open");
  if (android && C.pkg) {
    open.href = "intent://" + location.host + location.pathname + location.search + "#Intent;scheme=https;package=" +
      C.pkg + ";S.browser_fallback_url=" +
      encodeURIComponent(C.play || location.href.replace(/\/at\/.*$/, "/")) + ";end";
    open.hidden = false;
  } else if (ios && C.scheme) {
    open.href = C.scheme + "://at/?rc=" + encodeURIComponent(rc);
    open.hidden = false;
  }
  $("rc-hint").textContent = open.hidden ? "打開台灣釣點地圖 →「設定」→「輸入兌換碼」，貼上兌換碼。"
    : "已經裝了 App：按「在 App 打開」，兌換碼會自動帶入，再按「兌換」就好。";
})();
</script>
